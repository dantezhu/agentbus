[program:agentbus-worker]
; Edit these paths and user for the target machine before installing.
directory=/path/to/agentbus
command=/path/to/agentbus/env/bin/agentbus worker run --config /home/agentbus/.agentbus/config.toml
user=agentbus

autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
stopasgroup=true

redirect_stderr=false
stdout_logfile=/home/agentbus/.agentbus/logs/agentbus-worker.supervisor.out.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/home/agentbus/.agentbus/logs/agentbus-worker.supervisor.err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5
