# Sample NATS config for agentbus.
# Replace sample passwords before use. Use one username/password pair per agent.

server_name: agentbus
port: 7422
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 256MiB
  max_file_store: 10GiB
}

accounts {
  AGENTS: {
    users: [
      {
        user: "agent-main"
        password: "agent_main_password"
        permissions: {
          publish: ["agent.*.tasks", "agent.main.heartbeat", "$JS.API.>"]
          subscribe: ["agent.main.results", "_INBOX.>"]
        }
      },
      {
        user: "agent-code"
        password: "agent_code_password"
        permissions: {
          publish: ["agent.main.results", "agent.code.results", "agent.code.heartbeat", "$JS.API.>"]
          subscribe: ["agent.code.tasks", "_INBOX.>"]
        }
      },
      {
        user: "agent-doc"
        password: "agent_doc_password"
        permissions: {
          publish: ["agent.main.results", "agent.doc.results", "agent.doc.heartbeat", "$JS.API.>"]
          subscribe: ["agent.doc.tasks", "_INBOX.>"]
        }
      }
    ]
  }
}

# For production, point a DNS record such as agentbus.example.com to this server
# and enable TLS with a certificate whose SAN matches that domain. Example:
# tls {
#   cert_file: "/etc/nats/tls/fullchain.pem"
#   key_file: "/etc/nats/tls/privkey.pem"
# }
