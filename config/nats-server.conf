# Sample NATS config for agentbus.
# Replace sample passwords before use. Use one username/password pair per agent.

server_name: agentbus
port: 7422
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/data/nats"
  max_mem_store: 256MiB
  max_file_store: 10GiB
}

accounts {
  AGENTS: {
    jetstream: enabled
    users: [
      {
        user: "main"
        password: "main_password"
        permissions: {
          publish: ["agentbus.*.tasks", "agentbus.main.heartbeat", "$JS.API.>"]
          subscribe: ["agentbus.main.results", "_INBOX.>"]
        }
      },
      {
        user: "coder"
        password: "coder_password"
        permissions: {
          publish: ["agentbus.main.results", "agentbus.coder.results", "agentbus.coder.heartbeat", "$JS.API.>"]
          subscribe: ["agentbus.coder.tasks", "_INBOX.>"]
        }
      },
      {
        user: "reviewer"
        password: "reviewer_password"
        permissions: {
          publish: ["agentbus.main.results", "agentbus.reviewer.results", "agentbus.reviewer.heartbeat", "$JS.API.>"]
          subscribe: ["agentbus.reviewer.tasks", "_INBOX.>"]
        }
      }
    ]
  }
}

# For production, point a DNS record such as agentbus.example.com to this server
# and enable TLS with a certificate whose SAN matches that domain. Example:
# tls {
#   cert_file: "/etc/nats/tls/fullchain.pem"
#   key_file: "/etc/nats/tls/privkey.pem"
# }
