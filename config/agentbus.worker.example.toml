# Example worker config for agentbus worker.
# Copy to one of:
#   ./agentbus.toml
#   ~/.agentbus/config.toml
#   /etc/agentbus/agentbus.toml
# Or pass explicitly:
#   agentbus worker run --config /path/to/config.toml

[agent]
id = "code"
# Required. Either string or list is accepted.
# If no {input} placeholder is present, AgentBus appends the prompt as the final argument.
chat_cmd = ["agent-cli", "chat", "--oneshot", "{input}"]
# chat_cmd = "agent-cli chat --oneshot"
# Use {input} when the prompt must appear before later flags.
# chat_cmd = "agent-cli run --prompt {input} --json"
# Hermes example:
# chat_cmd = "hermes chat -q -Q {input}"
timeout_seconds = 1800
extra_instruction = ""

[nats]
url = "tls://username:password@agentbus.example.com:7422"
stream = "AGENT_TASKS"
task_subject = "agent.code.tasks"
default_result_subject = "agent.main.results"
# Durable consumer name. Keep stable per worker identity so NATS remembers ack/progress.
durable = "agent-code"

[log]
dir = "~/.agentbus/logs"
max_bytes = 104857600
backup_count = 5

[limits]
max_payload_bytes = 1048576

[connection]
reconnect_time_wait_seconds = 2
max_reconnect_attempts = -1
