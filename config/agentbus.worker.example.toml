# Example worker config for agentbus worker.
# Copy to one of:
#   ./agentbus.toml
#   ~/.agentbus/config.toml
#   /etc/agentbus/agentbus.toml
# Or pass explicitly:
#   agentbus worker run --config /path/to/config.toml

[agent]
id = "agent-code"
# Required. Must be a TOML array of strings. String-form commands are rejected
# so the generated multi-line prompt replaces one argv argument exactly.
chat_cmd = ["agent-cli", "chat", "--oneshot", "{input}"]
# Use {input} where the generated prompt belongs.
# chat_cmd = ["agent-cli", "run", "--prompt", "{input}", "--json"]
# Hermes example:
# chat_cmd = ["hermes", "chat", "-q", "-Q", "{input}"]
extra_instruction = ""

[worker]
task_timeout_seconds = 1800
max_task_bytes = 1048576
reconnect_time_wait_seconds = 2
max_reconnect_attempts = -1

[nats]
url = "tls://username:password@agentbus.example.com:7422"
stream = "AGENT_TASKS"
task_subject = "agent.agent-code.tasks"
default_result_subject = "agent.agent-main.results"
# Durable consumer name. Keep stable per worker identity so NATS remembers ack/progress.
durable = "agent-code"

[log]
dir = "~/.agentbus/logs"
max_bytes = 104857600
backup_count = 5
