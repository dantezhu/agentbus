[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbus"
version = "0.1.0"
description = "NATS JetStream task bus for distributed agent programs"
requires-python = ">=3.11"
dependencies = [
  "nats-py>=2.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
agentbus-worker = "agentbus.cli:main"

[tool.setuptools.packages.find]
include = ["agentbus*"]

[tool.pytest.ini_options]
pythonpath = ["."]
